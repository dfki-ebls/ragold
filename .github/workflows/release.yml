name: release
on:
  workflow_dispatch:
permissions: {}
# Never cancel a running release halfway through publishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  check:
    uses: $/.github/workflows/check.yml
    permissions:
      contents: read
    secrets:
      CACHIX_TOKEN: ${{ secrets.CACHIX_TOKEN }}
  release:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'dfki-ebls' }}
    needs: check
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semanticrelease.outputs.version }}
      released: ${{ steps.semanticrelease.outputs.released }}
      git-head: ${{ steps.semanticrelease.outputs.git-head }}
    environment:
      name: release
      url: https://github.com/dfki-ebls/ragold/releases/tag/${{ steps.semanticrelease.outputs.git-tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cihelper/action-semanticrelease-npm@v1
        id: semanticrelease
  deploy-docker:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    permissions:
      contents: read
      packages: write
    environment:
      name: release
      url: https://ghcr.io/dfki-ebls/ragold
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.git-head }}
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          extra-conf: |
            accept-flake-config = true
            log-lines = 1000
            extra-platforms = aarch64-linux
      - uses: cachix/cachix-action@v17
        with:
          name: dfki-ebls
          authToken: ${{ secrets.CACHIX_TOKEN }}
      - run: nix run .#docker-manifest --impure
        env:
          VERSION: ${{ needs.release.outputs.version }}
          GH_TOKEN: ${{ github.token }}
